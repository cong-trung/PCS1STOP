[project]
name = "pcs1stop"
version = "2.0.0"
description = "PCS 1-Stop recipe editor (NiceGUI) with a PC1 task queue and PC2 workers"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "lxml>=6.1.3",
    "nicegui>=3.18.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pyflakes>=3.2",
    "pytest>=8.0",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
